# CI do KURIO (CP7, revisado no CP9 e no CP9.1). Executado no GitHub Actions a partir do CP9.1;
# resultados registrados em planning/CP9_1_REPORT.md.
#
# Jobs:
# - quality: typecheck, lint, build, verificação do build público, unitários e E2E.
# - lighthouse: auditoria independente (push na main e manual), relatórios como artefato.
# - visual-baselines-linux (manual): gera as baselines visuais Linux no container oficial do
#   Playwright e as publica como artefato para REVISÃO. Nada é commitado automaticamente:
#   as imagens são inspecionadas e versionadas por uma pessoa.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # CP9.1: push e execução manual em grupos separados (gerar baselines não cancela a CI do push).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      # O mesmo build de demonstração da entrega: MSW ativo (VITE_ENABLE_MOCKS em .env).
      PW_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build público sem rotas internas (/demo/* em 404, deep links)
        run: npm run check:public-build

      - name: Testes unitários
        run: npm run test:unit

      - name: Testes E2E (desktop, mobile e responsivo)
        # Regressão visual: sem baseline Linux versionada, o teste é ignorado com motivo
        # explícito (as baselines Linux são geradas no container oficial: test:visual:update:linux).
        run: npm run test:e2e:browsers

      - name: Relatório HTML do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Traces, capturas e diffs das falhas
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  visual-baselines-linux:
    name: Gerar baselines visuais Linux (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Mesma imagem do script test:visual:update:linux (mesma versão do Playwright do lockfile).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      CI: 'true'
      PW_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Gerar baselines Linux (somente regressão visual)
        run: npx playwright test e2e/visual.spec.ts --project=desktop-chromium --project=mobile-chromium --update-snapshots

      - name: Publicar as baselines para revisão
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 30

  lighthouse:
    # CP9.1: execução INDEPENDENTE da auditoria, em outra máquina (runner do GitHub). Mesmo script
    # oficial (scripts/lighthouse.mjs: build de produção + vite preview + MSW ativo + configuração
    # padrão do Lighthouse, 3 execuções por página e perfil), mesmas versões (lockfile, Node do
    # .nvmrc, Chromium do Playwright do lockfile). O hardware é outro: cada execução registra o
    # índice de CPU do Lighthouse, e o resumo registra CPU, memória e imagem do runner. Os
    # relatórios ficam como artefato; nada substitui as medições locais.
    name: Lighthouse independente (3 execuções por página e perfil)
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      LH_OUT: lighthouse-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Instalar o Chromium do Playwright (mesmo navegador da auditoria local)
        run: npx playwright install --with-deps chromium

      # Ubuntu 24.04 restringe namespaces de usuário sem privilégio (AppArmor), e o sandbox do Chrome
      # não sobe ("waiting for dynamic debugging port", 1ª execução). Liberar no runner mantém as MESMAS
      # flags do Chrome da auditoria local (sem --no-sandbox), o que preserva a comparabilidade.
      - name: Permitir o sandbox do Chrome (AppArmor do Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Hardware do runner
        run: |
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core'
          free -h

      - name: Auditoria Lighthouse (12 execuções, sequenciais)
        run: npm run audit:lighthouse

      - name: Publicar relatórios (HTML, JSON e resumo)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-${{ github.sha }}
          path: lighthouse-ci/
          if-no-files-found: error
          retention-days: 90
